name: Generate 15s AI Cinematic Trailer

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Optional English text-to-video prompt"
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-persian-trailer.yml"
      - "scripts/create_persian_trailer.py"

permissions:
  contents: read

concurrency:
  group: ai-cinematic-trailer
  cancel-in-progress: false

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate 15-second video with Wan 2.7
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          VIDEO_PROMPT: ${{ inputs.prompt }}
        run: python scripts/create_persian_trailer.py

      - name: Upload generated MP4
        uses: actions/upload-artifact@v4
        with:
          name: kheezesh-farmanravaan-ai-trailer-15s
          path: outputs/trailer/kheezesh-farmanravaan-trailer-en.mp4
          if-no-files-found: error
          retention-days: 30

name: Build Persian Gameplay Trailer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trailer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg, Persian fonts and Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          python -m pip install --upgrade pip
          python -m pip install edge-tts pillow arabic-reshaper python-bidi
      - name: Build trailer with Persian narration
        run: python scripts/create_persian_trailer.py
      - name: Upload MP4 trailer
        uses: actions/upload-artifact@v4
        with:
          name: kheezesh-farmanravaan-persian-gameplay-trailer
          path: outputs/trailer/kheezesh-farmanravaan-trailer-fa.mp4
          if-no-files-found: error
          retention-days: 30

name: Generate 3D Model (CPU + RAM)

run-name: "CPU 3D generation — Shap-E"

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "English prompt (empty = use prompts/nader_shah_afshar.txt)"
        required: false
        type: string
        default: ""
      seed:
        description: "Generation seed"
        required: true
        type: string
        default: "42"
      steps:
        description: "Quality / speed (32 recommended; higher is slower)"
        required: true
        type: choice
        options:
          - "24"
          - "32"
          - "48"
          - "64"
        default: "32"

permissions:
  contents: read

concurrency:
  group: cpu-3d-generation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_HOME: ${{ github.workspace }}/.models/huggingface
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      CPU_THREADS: "4"
      PROMPT_INPUT: ${{ inputs.prompt }}
      SEED: ${{ inputs.seed }}
      STEPS: ${{ inputs.steps }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show CPU and RAM
        run: |
          echo "CPU:"
          lscpu
          echo "Memory:"
          free -h
          echo "This workflow runs on CPU only; no CUDA or GPU is required."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-cpu.txt

      - name: Cache Hugging Face model files
        uses: actions/cache@v4
        with:
          path: .models/huggingface
          key: shap-e-cpu-model-v1
          restore-keys: |
            shap-e-cpu-model-

      - name: Install CPU-only PyTorch and Shap-E dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cpu.txt
          python - <<'PY'
          import torch
          print("PyTorch:", torch.__version__)
          print("CUDA available:", torch.cuda.is_available())
          print("CPU threads:", torch.get_num_threads())
          PY

      - name: Generate 3D mesh on CPU
        run: |
          args=(
            --seed "$SEED"
            --steps "$STEPS"
            --output-dir outputs/nader_shah_afshar
          )
          if [ -n "$PROMPT_INPUT" ]; then
            args+=(--prompt "$PROMPT_INPUT")
          else
            args+=(--prompt-file prompts/nader_shah_afshar.txt)
          fi
          python generate_cpu.py "${args[@]}"

      - name: Upload generated 3D files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nader-shah-afshar-cpu-3d
          path: |
            outputs/nader_shah_afshar/*.glb
            outputs/nader_shah_afshar/*.ply
            outputs/nader_shah_afshar/metadata.json
          if-no-files-found: warn
          retention-days: 14
